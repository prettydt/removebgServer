version: '3.8'

services:
  removebg:
    build: .
    container_name: removebg-server
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_KEYS=${ALLOWED_KEYS:-test123,test456}
      - MODEL_PATH=models/u2netp.onnx
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Mount models directory to allow easy model updates
      - ./models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
